events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Standard Main Access log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr"';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name localhost;

        # 🔐 Gateway-level auth chokepoint (D51). `internal;` makes this unreachable from
        # outside — it only answers nginx's own auth_request subrequests, forwarding the
        # caller's Authorization header to the same get_current_user() check every service
        # already runs in-process. A connection failure/timeout here (user-service down)
        # surfaces as a 500, remapped below to a 503 distinct from a genuine bad-token 401.
        location = /_gateway/verify {
            internal;
            proxy_pass http://user-service:8001/api/v1/users/internal/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 2s;
            proxy_send_timeout    2s;
            proxy_read_timeout    3s;
        }

        error_page 500 = @gateway_auth_unavailable;
        location @gateway_auth_unavailable {
            default_type application/json;
            return 503 '{"status": 503, "body": null, "message": "Authentication service unavailable", "errors": ["gateway could not reach the identity verification endpoint"]}';
        }

        # auth_request forwards the verify subrequest's status code on failure but not its
        # body, so a bare 401 here would break D35's "every response is an envelope" rule.
        error_page 401 = @gateway_unauthorized;
        location @gateway_unauthorized {
            default_type application/json;
            return 401 '{"status": 401, "body": null, "message": "Authentication required", "errors": ["missing, expired or invalid access token"]}';
        }

        # --- Public routes: exact matches, checked before any prefix location regardless
        # of declared order, so these stay reachable without a token even though they sit
        # under a prefix that is gated below. ---

        location = /api/v1/users/login {
            proxy_pass http://user-service:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/users/register {
            proxy_pass http://user-service:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/users/refresh {
            proxy_pass http://user-service:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/users/health {
            proxy_pass http://user-service:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/restaurants/health {
            proxy_pass http://restaurant-service:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/menus/health {
            proxy_pass http://menu-service:8003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/orders/health {
            proxy_pass http://order-service:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/payments/health {
            proxy_pass http://payment-service:8005;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/riders/health {
            proxy_pass http://rider-service:8006;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- Internal-key-only routes: no end user ever holds this credential (D15), so
        # these carry no bearer token at all and would fail auth_request even legitimately.
        # They bypass the gateway's bearer check here but remain guarded by their own
        # X-Internal-Key dependency (require_internal) inside the service — this is not a
        # public route, it is a different credential than the one auth_request checks.
        # Regex locations take precedence over the plain-prefix gated locations below
        # regardless of file order, which is what makes this bypass work. ---

        location = /api/v1/orders/logs {
            proxy_pass http://order-service:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/api/v1/orders/[^/]+/internal$ {
            proxy_pass http://order-service:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/api/v1/orders/[^/]+/rider-report$ {
            proxy_pass http://order-service:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/api/v1/orders/[^/]+/transitions$ {
            proxy_pass http://order-service:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/riders/dispatch {
            proxy_pass http://rider-service:8006;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/riders/release {
            proxy_pass http://rider-service:8006;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/payments/authorize {
            proxy_pass http://payment-service:8005;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/payments/refund {
            proxy_pass http://payment-service:8005;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/api/v1/users/[^/]+/internal$ {
            proxy_pass http://user-service:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 👤 Route User service requests — gated: every other /api/v1/users/* path requires
        # a valid bearer token, verified at the gateway via auth_request before the request
        # ever reaches the backend (D51).
        location /api/v1/users {
            auth_request /_gateway/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_roles $upstream_http_x_user_roles;

            proxy_pass http://user-service:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Roles $auth_user_roles;
        }

        # 🏪 Route Restaurant service requests — gated (D51)
        location /api/v1/restaurants {
            auth_request /_gateway/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_roles $upstream_http_x_user_roles;

            proxy_pass http://restaurant-service:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Roles $auth_user_roles;
        }

        # 📜 Route Menu service requests — gated (D51)
        location /api/v1/menus {
            auth_request /_gateway/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_roles $upstream_http_x_user_roles;

            proxy_pass http://menu-service:8003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Roles $auth_user_roles;
        }

        # 🛍️ Route Order service requests — gated (D51)
        location /api/v1/orders {
            auth_request /_gateway/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_roles $upstream_http_x_user_roles;

            proxy_pass http://order-service:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Roles $auth_user_roles;
        }

        # 💳 Route Payment service requests — gated (D51)
        location /api/v1/payments {
            auth_request /_gateway/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_roles $upstream_http_x_user_roles;

            proxy_pass http://payment-service:8005;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Roles $auth_user_roles;
        }

        # 🛵 Route Rider service requests — gated (D51)
        location /api/v1/riders {
            auth_request /_gateway/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_roles $upstream_http_x_user_roles;

            proxy_pass http://rider-service:8006;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Roles $auth_user_roles;
        }

        # 🎼 Route only the Orchestrator Service's health probe. `location =` is an exact
        # match, not a prefix, and since D47 there is nothing else on that service to
        # match: the saga routes it once carried are gone, because services start and
        # signal workflows through their own Temporal client rather than over HTTP. The
        # exact match stays anyway — it is what keeps a future route on this service from
        # becoming publicly reachable the moment someone adds one.
        location = /api/v1/orchestrator/health {
            proxy_pass http://orchestrator-service:8007;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # The Temporal Web UI (localhost:8233) is deliberately absent. It is an operator
        # tool with no authentication of its own, so proxying it through the public gateway
        # would publish every workflow's history — including the arguments each was started
        # with. Reach it directly on the host instead.

        # Global health check endpoint. Enveloped the same as every service response
        # (D35), so a client does not need a special case for the one health probe that
        # isn't behind a service's own router.
        location /health {
            return 200 '{"status": 200, "body": {"service": "api-gateway"}, "message": "gateway is healthy", "errors": null}';
            add_header Content-Type application/json;
        }
    }
}
