<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartFoodOps Assistant</title>
<!--
  A small chat client for the Week 5 assistant (D63): sign in as a customer, ask about food or an order,
  and watch the answer stream in. One file, no build step, no dependencies. The gateway serves it at
  /chat/ (api-gateway/nginx.conf), so every call below is same-origin and needs no CORS.

  It talks to the public API only: POST /api/v1/users/{register,login,refresh,logout} and
  GET /api/v1/ai/assistant/stream. EventSource cannot send an Authorization header, so the stream is
  read with fetch() and parsed by hand. Everything the model writes is escaped before it is shown.
-->
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --brand:#db2777; --brand-ink:#fff; --user:#2563eb; --warn:#b45309; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  [hidden] { display: none !important; }
  button, input, textarea { font: inherit; }
  .center { min-height: 100%; display: grid; place-items: center; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .login { width: 100%; max-width: 380px; padding: 28px; }
  .login h1 { margin: 0 0 4px; font-size: 22px; }
  .login p { margin: 0 0 18px; color: var(--muted); }
  label { display: block; margin: 12px 0 4px; font-size: 13px; color: var(--muted); }
  input[type=email], input[type=password], input[type=text], input[type=tel] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  input:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--brand) 40%, transparent); border-color: var(--brand); }
  .primary { width: 100%; margin-top: 18px; padding: 11px; border: 0; border-radius: 8px; background: var(--brand); color: var(--brand-ink); font-weight: 600; cursor: pointer; }
  .primary:disabled { opacity: .6; cursor: default; }
  .link { background: none; border: 0; color: var(--brand); cursor: pointer; padding: 0; }
  .switch { margin-top: 14px; text-align: center; color: var(--muted); font-size: 13px; }
  .error { margin-top: 12px; padding: 9px 12px; border-radius: 8px; background: #fef2f2; color: #b91c1c; font-size: 13px; }

  .app { height: 100%; display: flex; flex-direction: column; max-width: 820px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
  header h1 { margin: 0; font-size: 17px; flex: 1; }
  header .who { color: var(--muted); font-size: 13px; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ghost { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.err { align-self: flex-start; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
  .meta { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .meta .warn { color: var(--warn); }
  .typing::after { content: "▍"; animation: blink 1s steps(2) infinite; margin-left: 1px; }
  @keyframes blink { 50% { opacity: 0; } }
  .hints { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
  .hints button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .hints button:hover { border-color: var(--brand); color: var(--brand); }
  form.composer { display: flex; gap: 8px; padding: 12px 16px 16px; align-items: flex-end; }
  textarea { flex: 1; resize: none; max-height: 140px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  #send { border: 0; background: var(--brand); color: #fff; border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
  #send:disabled { opacity: .6; cursor: default; }
  .opts { padding: 0 16px 10px; color: var(--muted); font-size: 12px; }
  .opts label { display: inline; margin: 0; font-size: 12px; }
</style>
</head>
<body>

<div class="center" id="auth">
  <form class="card login" id="authForm" autocomplete="on">
    <h1>SmartFoodOps</h1>
    <p id="authLead">Sign in to talk to the assistant.</p>
    <div id="registerOnly" hidden>
      <label for="fullName">Full name</label>
      <input id="fullName" type="text" autocomplete="name" minlength="2">
      <label for="phone">Phone</label>
      <input id="phone" type="tel" autocomplete="tel" minlength="8">
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="primary" id="authSubmit" type="submit">Sign in</button>
    <div class="error" id="authError" hidden></div>
    <div class="switch"><span id="switchText">New here?</span> <button class="link" id="switchMode" type="button">Create a customer account</button></div>
  </form>
</div>

<div class="app" id="chat" hidden>
  <header>
    <h1>🍽 Food assistant</h1>
    <span class="who" id="who"></span>
    <button class="ghost" id="newChat" type="button">New chat</button>
    <button class="ghost" id="signOut" type="button">Sign out</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <div class="hints" id="hints"></div>
  <div class="opts"><label><input type="checkbox" id="useLocation"> Share my location (adds distances to restaurants)</label></div>
  <form class="composer" id="composer">
    <textarea id="input" rows="1" maxlength="500" placeholder="Ask about food, a restaurant, or an order…" aria-label="Your message"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
"use strict";
const API = "/api/v1";
const HINTS = [
  "Recommend a spicy halal dish under $15",
  "Something vegan and light for lunch",
  "Where is my latest order?",
  "Why was my order cancelled?",
];

const $ = (id) => document.getElementById(id);
const store = {
  get tokens() { try { return JSON.parse(sessionStorage.getItem("sfo_tokens")); } catch { return null; } },
  set tokens(v) { v ? sessionStorage.setItem("sfo_tokens", JSON.stringify(v)) : sessionStorage.removeItem("sfo_tokens"); },
  get email() { return sessionStorage.getItem("sfo_email") || ""; },
  set email(v) { v ? sessionStorage.setItem("sfo_email", v) : sessionStorage.removeItem("sfo_email"); },
};
let conversationId = null;
let busy = false;
let registering = false;
let coords = null;

// ---- API helpers -------------------------------------------------------------------------------
// Every response is the platform envelope {status, body, message, errors} (D35).
async function call(path, { method = "GET", body, auth = false } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (auth && store.tokens) headers.Authorization = "Bearer " + store.tokens.access_token;
  const res = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const env = await res.json().catch(() => ({}));
  if (!res.ok) throw new ApiError(res.status, describe(env, res.status));
  return env.body;
}
class ApiError extends Error { constructor(status, message) { super(message); this.status = status; } }
function describe(env, status) {
  if (env && Array.isArray(env.errors) && env.errors.length) {
    return env.errors.map((e) => (typeof e === "string" ? e : e.message || e.msg || JSON.stringify(e))).join("; ");
  }
  return (env && env.message) || "Request failed (" + status + ")";
}

async function refresh() {
  const t = store.tokens;
  if (!t || !t.refresh_token) return false;
  try {
    store.tokens = await call("/users/refresh", { method: "POST", body: { refresh_token: t.refresh_token } });
    return true;
  } catch { store.tokens = null; return false; }
}

// ---- Sign in / register -------------------------------------------------------------------------
function setMode(register) {
  registering = register;
  $("registerOnly").hidden = !register;
  $("authLead").textContent = register ? "Create a customer account." : "Sign in to talk to the assistant.";
  $("authSubmit").textContent = register ? "Create account" : "Sign in";
  $("switchText").textContent = register ? "Already registered?" : "New here?";
  $("switchMode").textContent = register ? "Sign in" : "Create a customer account";
  $("password").autocomplete = register ? "new-password" : "current-password";
  $("authError").hidden = true;
}
$("switchMode").onclick = () => setMode(!registering);

$("authForm").onsubmit = async (e) => {
  e.preventDefault();
  const email = $("email").value.trim(), password = $("password").value;
  $("authSubmit").disabled = true; $("authError").hidden = true;
  try {
    if (registering) {
      await call("/users/register", { method: "POST", body: {
        email, password, full_name: $("fullName").value.trim(), phone: $("phone").value.trim(), role: "customer" } });
    }
    store.tokens = await call("/users/login", { method: "POST", body: { email, password } });
    store.email = email;
    $("password").value = "";
    showChat();
  } catch (err) {
    $("authError").textContent = err.message; $("authError").hidden = false;
  } finally { $("authSubmit").disabled = false; }
};

async function signOut() {
  const t = store.tokens;
  if (t) { try { await call("/users/logout", { method: "POST", auth: true, body: { refresh_token: t.refresh_token } }); } catch {} }
  store.tokens = null; store.email = ""; conversationId = null;
  $("log").innerHTML = ""; $("auth").hidden = false; $("chat").hidden = true;
}
$("signOut").onclick = signOut;

// ---- Chat ----------------------------------------------------------------------------------------
function showChat() {
  $("auth").hidden = true; $("chat").hidden = false;
  $("who").textContent = store.email;
  if (!$("log").children.length) greet();
  $("input").focus();
}
function greet() {
  addBubble("bot", "Hi! I can recommend dishes, tell you about restaurants, and explain what happened with your orders.");
  const hints = $("hints"); hints.innerHTML = "";
  for (const h of HINTS) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = h;
    b.onclick = () => { $("input").value = h; $("composer").requestSubmit(); };
    hints.appendChild(b);
  }
}
$("newChat").onclick = () => { if (busy) return; conversationId = null; $("log").innerHTML = ""; greet(); $("input").focus(); };

$("useLocation").onchange = (e) => {
  if (!e.target.checked) { coords = null; return; }
  if (!navigator.geolocation) { e.target.checked = false; return; }
  navigator.geolocation.getCurrentPosition(
    (p) => { coords = { latitude: p.coords.latitude, longitude: p.coords.longitude }; },
    () => { e.target.checked = false; coords = null; });
};

// The model's text is untrusted: escape everything, then turn **bold**, "- " bullets and line breaks into markup.
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function render(text) {
  return esc(text)
    .replace(/\*\*(.+?)\*\*/gs, "<strong>$1</strong>")
    .replace(/^[-*] /gm, "• ");
}
function addBubble(kind, text) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  if (kind === "bot") el.innerHTML = render(text); else el.textContent = text;
  $("log").appendChild(el); scroll();
  return el;
}
function scroll() { const l = $("log"); l.scrollTop = l.scrollHeight; }

$("input").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 140) + "px"; });
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); }
});

$("composer").onsubmit = async (e) => {
  e.preventDefault();
  const q = $("input").value.trim();
  if (!q || busy) return;
  $("input").value = ""; $("input").style.height = "auto"; $("hints").innerHTML = "";
  addBubble("user", q);
  await ask(q);
};

async function openStream(q) {
  const params = new URLSearchParams({ q });
  if (conversationId) params.set("conversation_id", conversationId);
  if (coords) { params.set("latitude", coords.latitude); params.set("longitude", coords.longitude); }
  const go = () => fetch(API + "/ai/assistant/stream?" + params, {
    headers: { Authorization: "Bearer " + store.tokens.access_token, Accept: "text/event-stream" } });
  let res = await go();
  if (res.status === 401 && (await refresh())) res = await go();   // access tokens last 15 minutes
  return res;
}

async function ask(q) {
  busy = true; $("send").disabled = true;
  const bubble = addBubble("bot", ""); bubble.classList.add("typing");
  let text = "", final = null;
  try {
    const res = await openStream(q);
    if (!res.ok) {
      const env = await res.json().catch(() => ({}));
      if (res.status === 401) { await signOut(); return; }
      throw new ApiError(res.status, res.status === 503
        ? "The assistant is unavailable right now. Please try again in a moment."
        : describe(env, res.status));
    }
    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buffer = "", heldCR = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      // The server ends lines with CRLF (as the SSE spec allows). Normalise to LF, holding back a trailing
      // CR in case its LF arrives in the next network chunk.
      let piece = heldCR + decoder.decode(value, { stream: true });
      heldCR = piece.endsWith("\r") ? "\r" : "";
      if (heldCR) piece = piece.slice(0, -1);
      buffer += piece.replace(/\r\n?/g, "\n");
      let cut;
      while ((cut = buffer.indexOf("\n\n")) >= 0) {          // one SSE event per blank-line-terminated block
        const block = buffer.slice(0, cut); buffer = buffer.slice(cut + 2);
        const data = block.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5).trimStart()).join("\n");
        if (!data) continue;
        let chunk; try { chunk = JSON.parse(data); } catch { continue; }
        if (chunk.token) { text += chunk.token; bubble.innerHTML = render(text); scroll(); }
        if (chunk.done) final = chunk;
      }
    }
    bubble.classList.remove("typing");
    if (final) {
      if (final.conversation_id) conversationId = final.conversation_id;
      // The tokens cannot be recalled once sent; when the guardrail rejects the finished answer the final
      // chunk carries the answer to show instead (D63).
      const replaced = final.grounded === false && final.replacement;
      if (replaced) { text = final.replacement; bubble.innerHTML = render(text); }
      const meta = document.createElement("div"); meta.className = "meta";
      meta.innerHTML = replaced
        ? '<span class="warn">⚠ The first draft could not be checked against our data, so this is a plain, verified answer.</span>'
        : (final.grounded ? "✓ Checked against menu and order data" : "") ;
      if (final.intent) meta.append(document.createTextNode((meta.textContent ? " · " : "") + final.intent.replace(/_/g, " ")));
      if (meta.textContent) bubble.appendChild(meta);
    }
    if (!text && !final) bubble.remove();
  } catch (err) {
    bubble.remove();
    addBubble("err", err.message || "Something went wrong.");
  } finally {
    bubble.classList.remove("typing");
    busy = false; $("send").disabled = false; $("input").focus();
  }
}

// ---- Start ----------------------------------------------------------------------------------------
if (store.tokens) showChat();
</script>
</body>
</html>
