version: '3.8'

networks:
  smartfoodops-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

services:
  # --- 1. DATABASES & CACHING ---
  db-postgres:
    image: postgres:15-alpine
    container_name: sfo-postgres
    restart: always
    environment:
      POSTGRES_DB: smartfoodops_core
      POSTGRES_USER: sfo_admin
      POSTGRES_PASSWORD: sfo_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # Auto-runs DDL migrations on boot
    networks:
      - smartfoodops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfo_admin -d smartfoodops_core"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-nosql:
    image: mongo:6.0
    container_name: sfo-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - smartfoodops-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache-redis:
    image: redis:7.0-alpine
    container_name: sfo-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smartfoodops-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 2. API GATEWAY (NGINX REVERSE PROXY) ---
  api-gateway:
    image: nginx:alpine
    container_name: sfo-api-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - restaurant-service
      - menu-service
      - order-service
    networks:
      - smartfoodops-network

  # --- 3. CORE SERVICE CONTAINER SERVICES ---
  user-service:
    build:
      # Context is ./services so the shared `common` chassis is inside the build context.
      context: ./services
      dockerfile: user/Dockerfile
    container_name: sfo-user-service
    restart: always
    environment:
      - DATABASE_URL=postgresql://sfo_admin:sfo_password_123@db-postgres:5432/smartfoodops_core
    depends_on:
      db-postgres:
        condition: service_healthy
    networks:
      - smartfoodops-network

  restaurant-service:
    build:
      context: ./services
      dockerfile: restaurant/Dockerfile
    container_name: sfo-restaurant-service
    restart: always
    environment:
      - DATABASE_URL=postgresql://sfo_admin:sfo_password_123@db-postgres:5432/smartfoodops_core
    depends_on:
      db-postgres:
        condition: service_healthy
    networks:
      - smartfoodops-network

  menu-service:
    build:
      context: ./services
      dockerfile: menu/Dockerfile
    container_name: sfo-menu-service
    restart: always
    environment:
      - MONGO_URI=mongodb://db-nosql:27017/smartfoodops_menus
      - REDIS_URL=redis://cache-redis:6379/0
    depends_on:
      db-nosql:
        condition: service_healthy
      cache-redis:
        condition: service_healthy
    networks:
      - smartfoodops-network

  order-service:
    build:
      context: ./services
      dockerfile: order/Dockerfile
    container_name: sfo-order-service
    restart: always
    environment:
      - DATABASE_URL=postgresql://sfo_admin:sfo_password_123@db-postgres:5432/smartfoodops_core
      - USER_SERVICE_URL=http://user-service:8001
      - RESTAURANT_SERVICE_URL=http://restaurant-service:8002
      - MENU_SERVICE_URL=http://menu-service:8003
    depends_on:
      db-postgres:
        condition: service_healthy
    networks:
      - smartfoodops-network
